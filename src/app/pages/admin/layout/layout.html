<html lang="en">

<head>
  <title>Bootstrap Example</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
  <nav class="navbar navbar-expand-sm navbar-dark bg-dark">
    <div class="container-fluid"> <a class="navbar-brand" href="javascript:void(0)">OrderNow</a> <button
        class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar"> <span
          class="navbar-toggler-icon"></span> </button>
      <div class="collapse navbar-collapse" id="mynavbar">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"> <a class="nav-link" routerLink="/products">Products</a> </li>
          <li class="nav-item"> <a class="nav-link" routerLink="/category">Customer Base</a> </li>
          <li class="nav-item"> <a class="nav-link" routerLink="/customer">Inventory</a> </li>
        </ul> <!-- Μικρό search -->
        <form class="search-box d-flex align-items-center"> <input class="search-input" type="text"
            placeholder="Search..."> <button class="search-btn" type="button"> <i class="bi bi-search"></i> </button>
        </form> <!-- Καλάθι δεξιά --> <a class="nav-link text-white ms-3" routerLink="/"> <i class="bi bi-cart-fill"
            style="font-size: 1.3rem;"></i> </a>
      </div>
    </div>
  </nav>
  <div class="container-fluid"> <router-outlet></router-outlet> </div>
